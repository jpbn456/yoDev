name: Cloudflare test deployment

on:
  push:
    branches: [test]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/package-lock.json
            frontend/package-lock.json
      - name: Install shared server
        run: npm ci
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Worker
        run: npm ci
        working-directory: cloudflare
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Test portable server and Turso adapter
        run: npx vitest run tests
      - name: Typecheck Vercel and shared server
        run: npx tsc --noEmit
      - name: Test Worker
        run: npm test
        working-directory: cloudflare
      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: cloudflare
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Apply isolated D1 migrations
        run: npx wrangler d1 migrations apply yodev-test --env test --remote
        working-directory: cloudflare
      - name: Deploy isolated Worker
        run: npx wrangler deploy --env test
        working-directory: cloudflare
